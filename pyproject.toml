[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "riciplay-miniproxy"
version = "0.9.8"
description = "A lightweight HTTP/S interception proxy for security research — always-on capture, timing, scope guard, Repeater + Intruder dashboard"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "Zaidux"},
]
keywords = ["proxy", "mitmproxy", "interception", "security", "bugbounty", "repeater", "intruder", "pac"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Internet :: Proxy Servers",
]
dependencies = [
    # One distribution owns mitmproxy imports/scripts; never install both.
    "riciplay-mitmproxy==12.3.1.1",
    "tornado>=6.6,<7",
    "packaging>=26.3,<27",
    "Flask>=3.0.0",
    "requests>=2.31.0",
    "textual>=0.40.0",
]

[project.optional-dependencies]
# Browser-TLS replay for the Repeater (Cloudflare/bot-managed targets). It is a
# compiled wheel, so it stays optional: the Repeater falls back to a plain
# request and the dashboard shows the install command.
tls = [
    "curl_cffi>=0.7",
    # The browser bridge needs Playwright. It also works with a system Chrome
    # (MINIPROXY_BROWSER_PATH) or an attached one (MINIPROXY_BROWSER_CDP).
    "playwright>=1.40",
]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
    "playwright>=1.40",
]

[project.scripts]
miniproxy = "miniproxy.__main__:main"

[project.urls]
Homepage = "https://github.com/Zaidux/miniproxy"
Repository = "https://github.com/Zaidux/miniproxy"
Changelog = "https://github.com/Zaidux/miniproxy/blob/main/CHANGELOG.md"
Security = "https://github.com/Zaidux/miniproxy/blob/main/SECURITY.md"

[tool.hatch.build.targets.wheel]
packages = ["src/miniproxy"]
exclude = ["**/intercept_queue.json", "**/intercept_decisions.json", "**/__pycache__/**", "**/*.db", "**/*.db-wal", "**/*.db-shm"]

[tool.hatch.build.targets.sdist]
exclude = ["**/intercept_queue.json", "**/intercept_decisions.json", "**/__pycache__/**", "**/*.db", "**/*.db-wal", "**/*.db-shm"]
include = [
    "src/miniproxy",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "SECURITY.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "package.json",
    "bin",
    "scripts",
    "examples",
    "docs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=60"
asyncio_default_fixture_loop_scope = "function"
