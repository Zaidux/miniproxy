name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.6.0)"
        required: true

permissions:
  contents: read

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/riciplay-miniproxy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches the package version
        run: |
          set -euo pipefail
          pkg_ver=$(python -c "
          import re
          t = open('pyproject.toml').read()
          print(re.search(r'^version = \"([^\"]+)\"', t, re.M).group(1))
          ")
          tag_ver="${GITHUB_REF_NAME#v}"
          if [ -n "${GITHUB_REF_NAME}" ] && [ "$tag_ver" != "$pkg_ver" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $pkg_ver"
            exit 1
          fi
          echo "Publishing version $pkg_ver"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check the tag does not already exist on PyPI
        run: |
          set -euo pipefail
          pkg=$(python -c "
          import re
          t = open('pyproject.toml').read()
          name = re.search(r'^name = \"([^\"]+)\"', t, re.M).group(1)
          print(name)
          ")
          ver=$(python -c "
          import re
          t = open('pyproject.toml').read()
          print(re.search(r'^version = \"([^\"]+)\"', t, re.M).group(1))
          ")
          if curl -sf "https://pypi.org/pypi/${pkg}/${ver}/json" > /dev/null; then
            echo "::error::${pkg} ${ver} is already on PyPI — refusing to overwrite"
            exit 1
          fi

      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/riciplay-miniproxy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          pkg_ver=$(node -p "require('./package.json').version")
          tag_ver="${GITHUB_REF_NAME#v}"
          if [ -n "${GITHUB_REF_NAME}" ] && [ "$tag_ver" != "$pkg_ver" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg_ver"
            exit 1
          fi

      - name: Refuse to overwrite an existing npm version
        run: |
          set -euo pipefail
          ver=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          if npm view "$name@$ver" version > /dev/null 2>&1; then
            echo "::error::$name@$ver already exists on npm — refusing to overwrite"
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance --access public